# Keeps the free Render API awake during Indian daytime, so demo visitors
# rarely hit a cold start. Limited hours on purpose: Render's free plan has
# 750 instance-hours a month shared across all services in the workspace.
name: Keep demo API warm

on:
  schedule:
    - cron: "*/10 3-16 * * *" # every 10 min, 08:30-22:30 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://letsresolve.onrender.com/health || true
